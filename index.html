<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生每日学习任务</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#20392b;background:#f4f8f4}*{box-sizing:border-box}body{margin:0}.hero{background:linear-gradient(120deg,#147947,#27a16d);color:#fff;padding:34px 18px 62px}.wrap{max-width:980px;margin:auto}.hero h1{margin:0;font-size:27px}.hero p{opacity:.9;margin:10px 0 0;font-size:14px}.panel{background:#fff;border-radius:18px;padding:18px;margin:-36px auto 22px;box-shadow:0 8px 28px #174f3015;position:relative}.search{width:100%;font:inherit;padding:14px 16px;border:1px solid #d5e4d8;border-radius:12px;outline:none}.search:focus{border-color:#289c65}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.pill{border:1px solid #d8e9df;background:white;color:#38624a;border-radius:99px;padding:8px 14px;cursor:pointer}.pill.active{background:#197c4d;color:#fff;border-color:#197c4d}.count{margin-left:auto;color:#667b6c;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:17px;margin-bottom:30px}.card{background:white;border:1px solid #e2ece5;border-radius:18px;padding:19px;box-shadow:0 3px 14px #173d2410}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-size:21px;font-weight:750}.tag{background:#e8f6ec;color:#16844b;border-radius:7px;padding:5px 9px;font-size:12px}.book{font-weight:650;color:#32764b;margin:12px 0}.section{margin:15px 0}.unit{font-size:13px;font-weight:750;color:#17764b;border-bottom:1px solid #e8eee9;padding-bottom:8px;margin-bottom:8px}.rows{display:flex;flex-wrap:wrap;gap:7px}.item{background:#f1f7f2;border-radius:8px;padding:7px 9px;font-size:13px;color:#3b5543}.extra{background:#f3f5f4;border-radius:10px;padding:10px 12px;color:#657168;font-size:13px;margin-top:12px;line-height:1.8}.copy{width:100%;border:1px solid #27925b;color:#18834f;background:#fff;border-radius:10px;padding:11px;margin-top:15px;font-size:14px;cursor:pointer}.copy:hover{background:#eff9f2}.notice{font-size:13px;line-height:1.7;color:#697b6e;margin:16px 0 28px}.empty{grid-column:1/-1;text-align:center;padding:55px 12px;color:#708476}.small{font-size:12px;color:#6c8572}.tools{margin:14px 0 0;padding-top:12px;border-top:1px dashed #e1ebe4}input[type=file]{max-width:100%;font-size:13px}button{font-family:inherit}@media(max-width:600px){.hero h1{font-size:23px}.panel{margin-left:12px;margin-right:12px}.cards{padding:0 12px}.notice{padding:0 12px}}
</style></head><body><header class="hero"><div class="wrap"><h1>🌱 学生每日学习任务</h1><p>按姓名查找 · 按单元查看 · 一键复制任务</p></div></header><main class="wrap"><div class="panel"><input class="search" id="search" placeholder="搜索学生姓名（例如：测试学生）" autocomplete="off"><div class="bar" id="grades"></div><div class="tools"><div class="small">本页面默认使用虚构示例数据。你可以在自己的电脑上选择 CSV 进行本地预览；文件不会上传到服务器，也不会自动保存到网页。</div><input id="csv" type="file" accept=".csv,text/csv" style="margin-top:9px"><button class="pill" id="reset" style="margin-left:8px">恢复示例</button></div></div><div class="cards" id="cards"></div><p class="notice">隐私提示：GitHub Pages 是公开网站，请勿将包含真实学生姓名、登录账号、用户 ID 等信息的 CSV 或生成的数据文件提交到公开仓库。本地选择文件仅用于当前浏览器查看，刷新后恢复示例数据。</p></main><script>
const DEMO=[{name:'测试学生甲',grade:3,book:'三上（2024）',units:[{unit:'Unit 3',items:['单词跟读11个','单词记忆11个','词组跟读6个','词组翻译6个','句子跟读13个']}],text:2,practice:3,phonetic:1},{name:'测试学生乙',grade:4,book:'四上（2024）',units:[{unit:'Unit 2',items:['单词跟读14个','单词记忆14个','词组跟读7个','词组翻译7个','句子跟读16个','句子听力15个']},{unit:'Unit 3',items:['单词记忆闯关','单词翻译闯关']}],text:8,practice:0,phonetic:0},{name:'测试学生丙',grade:5,book:'五上（2024）',units:[{unit:'Unit 4',items:['单词跟读12个','单词记忆12个','句子跟读10个']}],text:2,practice:3,phonetic:1},{name:'测试学生丁',grade:6,book:'六上（2024）',units:[{unit:'Unit 5',items:['单词跟读10个','单词记忆10个','句子听力8个']}],text:8,practice:0,phonetic:0}];
let students=DEMO,selected='全部';const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanName(n){return String(n||'').replace(/新生\s*$/,'').trim()}function gradeOf(n,b){const m=String(n).match(/(?:^|\D)([3-6])\s*[.．年]/);if(m)return +m[1];const t=String(b||'');return ({三:3,四:4,五:5,六:6})[(t.match(/[三四五六]上|[三四五六]下/)||[''])[0]?.[0]]||0}function unitOf(s){return (String(s||'').match(/Unit\s*\d+(?:\s*[（(][^）)]+[）)])?/i)||[])[0]||String(s||'其他任务')}
function csvRows(t){if(t.charCodeAt(0)===65279)t=t.slice(1);let out=[],row=[],v='',quote=false;for(let i=0;i<t.length;i++){const c=t[i];if(quote){if(c==='"'&&t[i+1]==='"'){v+='"';i++}else if(c==='"')quote=false;else v+=c}else if(c==='"')quote=true;else if(c===','){row.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))out.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))out.push(row);const headers=out.shift()||[];return out.map(r=>Object.fromEntries(headers.map((h,i)=>[h.trim(),r[i]||''])))}
function shortBook(b){return String(b||'').replace(/[（(]20\d{2}[）)]/g,'').trim()}
function shortUnit(u){return String(u||'').replace(/^Unit\s*(\d+)/i,'U$1')}
function convert(rows){const people=new Map();for(const r of rows){const name=cleanName(r['学生姓名']);if(!name)continue;const book=r['教材名称']||'',module=(r['模块名称']||'').trim(),type=(r['学习类型']||'').trim(),unit=r['单元名称']||'',quantity=parseInt(r['目标数量'],10)||0;let p=people.get(name);if(!p){p={name,grade:gradeOf(r['学生姓名'],book),book:'',units:[],text:0,practice:0,phonetic:0,_groups:new Map()};people.set(name,p)}if(!p.grade)p.grade=gradeOf(r['学生姓名'],book);if(['单词','词组','句子'].includes(module)&&book&&!p.book)p.book=book;
if(module==='同步课文'){p.text++;continue}if(module==='同步练习'){p.practice++;continue}if(module==='音标'){p.phonetic++;continue}if(!['单词','词组','句子'].includes(module))continue;
const u=unitOf(unit),key=module+'|'+book+'|'+u;let group=p._groups.get(key);if(!group){group={unit:shortUnit(u),book,module,items:[],_items:new Map()};p._groups.set(key,group)}const isChallenge=(r['任务分类']||'').trim()==='单元闯关';let title=isChallenge?'完成'+module+(type||'学习')+'闯关':module+(type||'学习')+(quantity?quantity+'个':'');if(!group._items.has(title))group._items.set(title,true)}return [...people.values()].map(p=>{p.units=[...p._groups.values()].map(g=>({unit:g.unit,book:g.book,module:g.module,items:[...g._items.keys()]}));delete p._groups;return p}).filter(p=>p.units.length||p.text||p.practice||p.phonetic).sort((a,b)=>a.grade-b.grade||a.name.localeCompare(b.name,'zh-CN'))}
function describe(p){let s=p.name+'\n今日学习'+(shortBook(p.book)||'教材待确认');for(const g of p.units)s+='\n'+g.unit+'\n'+g.items.join('\n');if(p.text)s+='\n完成课文跟读'+p.text+'篇';if(p.practice)s+='\n完成同步练习'+p.practice+'个';if(p.phonetic)s+='\n完成音标学习'+(p.phonetic===1?'一个':p.phonetic+'个');return s}
function render(){const q=$('search').value.trim().toLowerCase();const gs=['全部',3,4,5,6];$('grades').innerHTML=gs.map(g=>'<button class="pill '+(selected===g?'active':'')+'" data-g="'+g+'">'+(g==='全部'?'全部年级':g+'年级')+'</button>').join('')+'<span class="count" id="count"></span>';document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{selected=b.dataset.g==='全部'?'全部':+b.dataset.g;render()});const shown=students.filter(p=>(selected==='全部'||p.grade===selected)&&p.name.toLowerCase().includes(q));$('count').textContent='共 '+shown.length+' 名学生';$('cards').innerHTML=shown.length?shown.map((p,i)=>'<article class="card"><div class="head"><span class="name">'+escapeHTML(p.name)+'</span><span class="tag">'+(p.grade?p.grade+'年级':'未识别年级')+'</span></div><div class="book">今日学习 '+escapeHTML(shortBook(p.book)||'相关教材')+'</div>'+p.units.map(g=>'<div class="section"><div class="unit">'+escapeHTML(g.unit)+(g.book&&g.book!==p.book?' · '+escapeHTML(shortBook(g.book)):'')+'</div><div class="rows">'+g.items.map(it=>'<span class="item">'+escapeHTML(it)+'</span>').join('')+'</div></div>').join('')+((p.text||p.practice||p.phonetic)?'<div class="extra">'+[p.text?'完成课文跟读'+p.text+'篇':'',p.practice?'完成同步练习'+p.practice+'个':'',p.phonetic?'完成音标学习'+(p.phonetic===1?'一个':p.phonetic+'个'):''].filter(Boolean).join('<br>')+'</div>':'')+'<button class="copy" data-copy="'+i+'">📋 复制学生任务</button></article>').join(''):'<div class="empty">没有找到符合条件的学生</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const p=shown[+b.dataset.copy],t=describe(p);try{await navigator.clipboard.writeText(t)}catch(e){const el=document.createElement('textarea');el.value=t;document.body.append(el);el.select();document.execCommand('copy');el.remove()}b.textContent='✓ 已复制';setTimeout(()=>b.textContent='📋 复制学生任务',1500)})}
$('search').oninput=render;$('reset').onclick=()=>{students=DEMO;$('csv').value='';$('search').value='';selected='全部';render()};$('csv').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=csvRows(await f.text());if(!rows.length||!('学生姓名' in rows[0]))throw Error('CSV 缺少学生姓名字段');students=convert(rows);selected='全部';$('search').value='';render();alert('已在当前浏览器中读取 '+students.length+' 名学生的任务。未上传任何数据；刷新网页后恢复示例。')}catch(err){alert('读取失败：'+err.message)}};render();
</script></body></html>
