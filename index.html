function csvRows(t){if(t.charCodeAt(0)===65279)t=t.slice(1);let out=[],row=[],v='',quote=false;for(let i=0;i<t.length;i++){const c=t[i];if(quote){if(c==='"'&&t[i+1]==='"'){v+='"';i++}else if(c==='"')quote=false;else v+=c}else if(c==='"')quote=true;else if(c===','){row.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))out.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))out.push(row);const headers=out.shift()||[];return out.map(r=>Object.fromEntries(headers.map((h,i)=>[h.trim(),r[i]||''])))}
function shortBook(b){return String(b||'').replace(/[（(]20\d{2}[）)]/g,'').trim()}
function shortUnit(u){return String(u||'').replace(/^Unit\s*(\d+)/i,'U$1')}
function isCompleted(r){return /^(已完成|完成)$/.test(String(r['完成状态']||'').replace(/[\s\u00a0\u3000]/g,''))}
function convert(rows,doneOnly=false){
 const people=new Map();
 const gradeOf=(n,b)=>{const m=n.match(/(?:^|\D)([1-9])\s*[.．年]/);if(m)return +m[1];return ({一:1,二:2,三:3,四:4,五:5,六:6})[(b.match(/[一二三四五六][上下]/)||[''])[0][0]]||0};
 for(const r of rows){
  if(doneOnly&&!isCompleted(r))continue;
  const name=String(r['学生姓名']||'').trim();if(!name)throw Error('存在学生姓名为空的记录，请核对 CSV');
  const uid=String(r['用户ID']||'').trim(),account=String(r['登录账号']||'').trim();
  const personKey=uid?'id:'+uid:account?'account:'+account:'name:'+name;
  const book=String(r['教材名称']||'').trim(),version=String(r['教材版本']||'').trim(),type=String(r['学习类型']||'').trim(),category=String(r['任务分类']||'').trim();
  const rawModule=String(r['任务项目']||r['模块名称']||r['学习模块']||'其他任务').trim();
  // 学习类型只决定动作；词组须由任务项目或教材版本明确标识。
  const module=/词组|固定搭配/.test(rawModule)||rawModule==='单词'&&/词组|固定搭配/.test(version)?'词组':rawModule;
  const quantity=parseInt(r['目标数量'],10)||0,unit=String(r['单元名称']||'').trim();
  let p=people.get(personKey);
  if(!p){p={name,grade:gradeOf(name,book),book,units:[],text:0,practice:0,phonetic:0,reading:0,_reading:new Set(),_groups:new Map(),_extras:new Map()};people.set(personKey,p)}
  if(p.name!==name)throw Error('同一用户ID或账号对应不同姓名：'+p.name+' / '+name+'，已停止生成，请核对 CSV');
  if(!p.grade)p.grade=gradeOf(name,book);if(!p.book&&book)p.book=book;
  const addExtra=kind=>{const key=JSON.stringify([kind,book,version]);let x=p._extras.get(key);if(!x){x={kind,book,version,count:0};p._extras.set(key,x)}x.count++};
  if(/阅读理解/.test([rawModule,unit,type,category,version,book].join(' '))){const key=JSON.stringify([book,version,unit||type||category]);if(!p._reading.has(key)){p._reading.add(key);addExtra('reading')}continue}
  if(module==='同步课文'&&!/阅读理解|听力|听写/.test(type)){p.text++;addExtra('text');continue}
  if((module==='同步练习'||module==='专项训练'&&/同步练习|同步训练/.test(type))&&!/阅读理解|听力|听写/.test(type)){p.practice++;addExtra('practice');continue}
  if(module==='音标'||/音标/.test(type)){p.phonetic++;addExtra('phonetic');continue}
  const u=(unit.match(/Unit\s*\d+(?:\s*[（(][^）)]+[）)])?/i)||[])[0]||unit||rawModule;
  const key=JSON.stringify([module,book,version,u]);let group=p._groups.get(key);
  if(!group){group={unit:u.replace(/^Unit\s*(\d+)/i,'U$1'),book,version,module,_items:new Set()};p._groups.set(key,group)}
  let title;
  if(/闯关/.test(category)||/闯关/.test(type))title='完成'+module+(type&&type!=='学习'?type:'')+'闯关';
  else title=!type||type===module||type.startsWith(module)?type||module:module+type;
  if(quantity>0&&!/闯关|课文|阅读理解/.test(title))title+=quantity+'个';
  group._items.add(title);
 }
 return [...people.values()].map(p=>{p.units=[...p._groups.values()].map(g=>({unit:g.unit,book:g.book,version:g.version,module:g.module,items:[...g._items]}));p.reading=p._reading.size;p.extras=[...p._extras.values()];delete p._reading;delete p._groups;delete p._extras;return p}).sort((a,b)=>a.grade-b.grade||a.name.localeCompare(b.name,'zh-CN'));
}
function extraLines(p){
 if(!p.extras)return [p.reading?'完成阅读理解'+p.reading+'篇':'',p.text?'完成课文跟读'+p.text+'篇':'',p.practice?'完成同步练习'+p.practice+'个':'',p.phonetic?'完成音标学习'+p.phonetic+'个':''].filter(Boolean);
 return p.extras.map(x=>({reading:'完成阅读理解'+x.count+'篇',text:'完成课文跟读'+x.count+'篇',practice:'完成同步练习'+x.count+'个',phonetic:'完成音标学习'+(x.count===1?'一个':x.count+'个')})[x.kind]+(x.book&&x.book!==p.book?'（'+x.book+'）':''));
}
function taskOrder(t){const x=String(t);const module=x.includes('单词')?0:x.includes('词组')?1:x.includes('句子')?2:3;const stage=x.includes('闯关')?2:x.includes('跟读')?0:1;const kind=x.includes('记忆')?0:x.includes('翻译')?1:x.includes('听力')?2:3;return module*100+stage*10+kind}
function sortTasks(){for(const p of students){for(const g of p.units){g.items.sort((a,b)=>taskOrder(a)-taskOrder(b))}}}
function describe(p){let s=p.name+'\n今日学习'+(shortBook(p.book)||'教材待确认');for(const g of p.units)s+='\n'+g.unit+(g.book&&g.book!==p.book?' · '+g.book:'')+'\n'+g.items.join('\n');if(extraLines(p).length)s+='\n'+extraLines(p).join('\n');return s}
function render(){sortTasks();const q=$('search').value.trim().toLowerCase();const gs=['全部',...new Set(students.map(p=>p.grade).filter(Boolean).sort((a,b)=>a-b))];$('grades').innerHTML=gs.map(g=>'<button class="pill '+(selected===g?'active':'')+'" data-g="'+g+'">'+(g==='全部'?'全部年级':g+'年级')+'</button>').join('')+'<span class="count" id="count"></span>';document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{selected=b.dataset.g==='全部'?'全部':+b.dataset.g;render()});const shown=students.filter(p=>(selected==='全部'||p.grade===selected)&&p.name.toLowerCase().includes(q));$('count').textContent='共 '+shown.length+' 名学生';$('cards').innerHTML=shown.length?shown.map((p,i)=>'<article class="card"><div class="head"><span class="name">'+escapeHTML(p.name)+'</span><span class="tag">'+(p.grade?p.grade+'年级':'未识别年级')+'</span></div><div class="book">今日学习 '+escapeHTML(shortBook(p.book)||'相关教材')+'</div>'+p.units.map(g=>'<div class="section"><div class="unit">'+escapeHTML(g.unit)+(' · '+escapeHTML(g.module))+(g.book&&g.book!==p.book?' · '+escapeHTML(shortBook(g.book)):'')+'</div><div class="rows">'+g.items.map(it=>'<span class="item">'+escapeHTML(it)+'</span>').join('')+'</div></div>').join('')+((p.reading||p.text||p.practice||p.phonetic)?'<div class="extra">'+extraLines(p).map(escapeHTML).join('<br>')+'</div>':'')+'<button class="copy" data-copy="'+i+'">📋 复制学生任务</button></article>').join(''):'<div class="empty">没有找到符合条件的学生</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const p=shown[+b.dataset.copy],t=describe(p);try{await navigator.clipboard.writeText(t)}catch(e){const el=document.createElement('textarea');el.value=t;document.body.append(el);el.select();document.execCommand('copy');el.remove()}b.textContent='✓ 已复制';setTimeout(()=>b.textContent='📋 复制学生任务',1500)})}
$('search').oninput=render;$('reset').onclick=()=>{students=DEMO;$('csv').value='';$('search').value='';selected='全部';render()};$('csv').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=csvRows(await f.text());if(!rows.length||!('学生姓名' in rows[0]))throw Error('CSV 缺少学生姓名字段');students=convert(rows,false);selected='全部';$('search').value='';render();alert('已在当前浏览器中读取 '+students.length+' 名学生的任务。未上传任何数据；刷新网页后恢复发布数据。')}catch(err){alert('读取失败：'+err.message)}};render();
</script></body></html>
